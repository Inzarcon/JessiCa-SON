[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [    
    "D",   # pydocstyle
    "E",   # pycodestyle Errors
    "W",   # pycodestyle Warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "C",   # Conventions
    "R",   # Refactor
    "N",   # pep8-Naming
    "C90", # mccabe
    "PL",  # pylint
    "RUF", # Ruff-specific

    # flake8 modules
    "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "FA", "ISC", "ICN", "LOG", "G",
    "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "FIX", "ERA",
    "PGH"

]

ignore = [
    "D203",  # Conflicts with no-blank-line-before-class
    "D213",  # Conflicts with multi-line-summary-first-line
]
