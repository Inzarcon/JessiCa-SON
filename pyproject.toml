[tool.ruff]
line-length = 120
fix = true
target-version = "py311"
exclude = [
    "thirdparty"
]

[tool.ruff.lint]
select = [    
    "D",   # pydocstyle
    "E",   # pycodestyle Errors
    "W",   # pycodestyle Warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "C",   # Conventions
    "R",   # Refactor
    "N",   # pep8-Naming
    "C90", # mccabe
    "PL",  # pylint
    "RUF", # Ruff-specific

    # flake8 modules
    "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "FA", "ISC", "ICN", "LOG", "G",
    "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "FIX", "ERA",
    "PGH",

]

ignore = [
    "D203",   # Conflicts with no-blank-line-before-class.
    "D213",   # Conflicts with multi-line-summary-first-line.
    "ANN101", # "self" parameter should not need annotation.
    "COM812", # Conflicts with Ruff formatter.
    "ISC001", # Conflicts with Ruff formatter.
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "D104"]  # Allow unused imports and missing docstrings.

"tests/*" = [
    "S101",             # Allow assert.
    "ANN001", "ARG001", # Allow implicitly used pytest fixtures.
    "PLR2004",          # Allow magic values.
    "INP001",           # Allow missing __init__.py (conflicts with test imports.)
    "SLF001",           # Allow private member access.
]

[tool.mypy]
mypy_path = "./src/"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "thirdparty.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"